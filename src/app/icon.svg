<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sygmia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#sygmia-grad)" stroke-width="8" stroke-opacity="0.5" />

  <!-- Stylized Sygmia 'S' Logo -->
  <g filter="url(#glow)">
    <path d="M 340 160 C 340 125, 300 110, 256 110 C 190 110, 150 150, 150 200 C 150 280, 360 250, 360 330 C 360 380, 310 402, 256 402 C 200 402, 160 375, 155 335" 
          fill="none" 
          stroke="url(#sygmia-grad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Tech Accent Dots -->
  <circle cx="340" cy="160" r="18" fill="#06b6d4" />
  <circle cx="155" cy="335" r="18" fill="#a855f7" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
